allowBuilds:
    esbuild: true
    ffmpeg-static: true
    sharp: true
    workerd: true
minimumReleaseAgeExclude:
    - esbuild@0.24.3
    - cookie@0.7.0
    - sharp@0.35.0
# Force patched versions of vulnerable transitive dependencies. Each is an
# upstream problem -- the direct dep still allows the vulnerable range -- and the
# override is the interim fix until upstream bumps its own floor. Verified: with
# any of these removed, pnpm resolves back to the vulnerable version.
# - esbuild <=0.24.2 (GHSA-67mh-4wv8-2f99): via drizzle-kit's deprecated @esbuild-kit
# - cookie <0.7.0 (GHSA-pxg6-pf52-xh8x): via @sveltejs/kit
# - sharp <0.35.0 (GHSA-f88m-g3jw-g9cj): via wrangler > miniflare
# - brace-expansion <5.0.8 (GHSA-mh99-v99m-4gvg, DoS): via eslint > minimatch (dev only)
overrides:
    esbuild@<0.24.3: ^0.25.0
    cookie@<0.7.0: ^0.7.2
    sharp@<0.35.0: ^0.35.0
    brace-expansion@<5.0.8: ^5.0.8
