<!doctype html>
<html lang="en">
    <head>
        <!-- No title or description here on purpose: they are rendered per game
             mode by src/routes/+layout.svelte. A static copy placed above the
             head placeholder would be the first one in the document, so it would
             win and the per-mode values would never apply. -->
        <meta name="theme-color" content="#799ec0" />
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="text-scale" content="scale" />
        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
