name: Keepalive

on:
    schedule:
        # Public repos auto-disable scheduled workflows after 60 days with no
        # repository activity, which would silently kill the daily-challenge cron.
        # A tiny empty commit resets that 60-day clock for every scheduled workflow
        # (including this one), so the set is self-sustaining. Twice a month (1st
        # and 15th) is ~4 shots per 60-day window -- ample margin against dropped
        # runs, and GitHub also emails a warning ~10 days before it would disable.
        # 07:27 UTC: a distinct hour from the daily (05:09) and verify (Mon 06:09)
        # crons, off the top of the hour to dodge high-load drops. `[skip ci]` asks
        # Workers Builds not to deploy the no-op commit; if not honored the worst
        # case is a harmless empty build, never a missed reset (so it commits to
        # the default branch, where the reset is guaranteed).
        - cron: '27 7 1,15 * *'
    workflow_dispatch:

jobs:
    keepalive:
        if: github.repository == 'mewdini/removedle'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
            - name: Empty keepalive commit
              run: |
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git commit --allow-empty -m 'chore: keepalive [skip ci]'
                  # checkout leaves a detached HEAD on scheduled runs; push the
                  # commit to the branch explicitly.
                  git push origin HEAD:main
