name: Daily Challenges

on:
    schedule:
        # 06:09 UTC daily. Deliberately off the top of the hour: GitHub can delay
        # or drop scheduled runs during the high-load spike at :00.
        #
        # This is only WHEN generation runs. Challenges unlock for players at
        # 21:00 Pacific (the site rolls over at 9pm PT -- see getGameDate; that is
        # 04:00-05:00 UTC depending on DST).
        #
        # The hour matters because the buffer's start date comes from the game
        # clock (scripts/generate-week.js = gameDate() + 1 .. +7). That is only
        # correct if the run lands AFTER the reset for the day it starts from,
        # otherwise +1 would name a day that is already live. 06:09 UTC is 23:09
        # PT in PDT and 22:09 PT in PST, i.e. 129 and 69 minutes past the reset,
        # and since Actions only ever delays a run, never fires one early, a delay
        # pushes it further into the safe window rather than out of it.
        #
        # Every run tops up a rolling 7-day buffer rather than generating exactly
        # one day. scripts/generate-week.js skips any of the next 7 days that
        # already has a challenge in R2, and retries what's missing. One bad run
        # only costs a day of buffer, not the whole week, and a sustained outage
        # gets up to 7 daily attempts to clear before a player would ever see a
        # missing challenge. scripts/challenge-health.js re-verifies the buffer
        # from R2 afterward and is what actually tracks and alerts on gaps
        #
        # The same run also does a full streaming-link liveness sweep, folded in
        # from the old standalone verify-links cron: one schedule we know fires
        # beats two independently-scheduled ones, given how much GitHub delays and
        # drops scheduled runs.
        - cron: '9 6 * * *'
    workflow_dispatch:
        inputs:
            target_date:
                description: 'Specific date to generate (YYYY-MM-DD)'
                required: false
                default: ''
            start_date:
                description: 'Start date for range (YYYY-MM-DD)'
                required: false
                default: ''
            end_date:
                description: 'End date for range (YYYY-MM-DD)'
                required: false
                default: ''

jobs:
    generate:
        if: github.repository == 'mewdini/removedle' && (github.event_name == 'schedule' || github.actor == 'mewdini')
        runs-on: ubuntu-latest
        # issues: write for the rolling link-health issue below; contents: read for
        # checkout. No contents: write -- this job never commits to the repo.
        permissions:
            contents: read
            issues: write
        steps:
            - uses: actions/checkout@v7

            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install

            - name: Restore cache
              id: cache-restore
              uses: actions/cache@v6
              with:
                  path: |
                      out/data
                      out/masters
                      out/covers
                      out/challenger/data
                      out/challenger/masters
                      out/challenger/covers
                  key: removedle-cache-${{ github.run_id }}
                  restore-keys: removedle-cache-

            # Every mode shares the same buckets, separated by key prefix, so each
            # pull excludes the other modes' prefixes (see scripts/sync-r2.js).
            # Without that, normal's pull would drag challenger/* into out/data and
            # normal's next push -- which overwrites wholesale -- would re-upload a
            # stale copy, silently reverting challenger's link heals and hides.
            # Deliberately NOT gated on a cache miss. restore-keys matches any
            # older cache by prefix, including ones saved before a mode existed --
            # those restore only the paths they held, so the new mode's registry
            # would be missing while the cache still counted as "hit" and skipped
            # this step, and generate would die with "No registry found". Pulling
            # every run is cheap anyway: syncPull skips any object whose size
            # already matches locally, so a warm cache downloads almost nothing.
            - name: Pull Masters & Data from R2
              run: |
                  node scripts/sync-r2.js pull-masters
                  node scripts/sync-r2.js pull-data
                  node scripts/sync-r2.js pull-masters --mode=challenger
                  node scripts/sync-r2.js pull-data --mode=challenger
              env:
                  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
                  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

            # scripts/generate-week.js does both modes itself and pushes each date
            # immediately after generating it. Required, not optional: generate-daily's
            # "last N days" dedup reads the challenges bucket over the S3 API, so a
            # later date in the same run cannot see an earlier one's picks until it's
            # pushed. A generate+push failure for one date is retried a couple of
            # times before moving on, without aborting the rest of the run, and
            # what's still missing after retries is left for tomorrow's cron, the
            # rolling buffer's actual retry mechanism, rather than blocking here.
            #
            # Explicit workflow_dispatch inputs behave exactly as before, one date
            # or an inclusive range, always regenerated. The scheduled run with no
            # inputs is the new default: top up the next 7 days, skipping whatever
            # already exists
            - name: Generate challenges (rolling 7-day buffer)
              run: |
                  START_DATE="${{ github.event.inputs.start_date }}"
                  END_DATE="${{ github.event.inputs.end_date }}"
                  TARGET_DATE="${{ github.event.inputs.target_date }}"

                  if [ -n "$START_DATE" ] && [ -n "$END_DATE" ]; then
                      node scripts/generate-week.js --start="$START_DATE" --end="$END_DATE"
                  elif [ -n "$TARGET_DATE" ]; then
                      node scripts/generate-week.js --target="$TARGET_DATE"
                  else
                      node scripts/generate-week.js
                  fi
              env:
                  # No MASTERS_DIR/DATA_DIR/OUTPUT_DIR here: they already equal the
                  # script defaults, and a dir override that does not name the mode
                  # is refused outright (scripts/lib/modes.js) -- that guard is what
                  # stops a stray DATA_DIR making a challenger run rewrite normal's
                  # registry and destroy its permanent song IDs.
                  #
                  # Needed since the challenges bucket went private: the generator
                  # reads the previous days' meta.json over the S3 API to avoid
                  # repeating songs, and generate-week.js pushes each date's
                  # output. Without these it throws instead of silently producing
                  # a challenge with no de-duplication
                  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
                  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

            # Flags a data problem as early as possible, separately from the
            # buffer/retry system and the challenge-health issue further down
            # if: always(), since this must still run even if the Generate step
            # above exited non-zero, which happens when every attempted
            # generation failed
            - name: Flag likely-permanent generation failures
              if: always()
              run: node scripts/flag-permanent-failures.js

            # A second, redundant push of whatever this run generated. Cheap,
            # since out/dailies holds only this run's output and nothing older
            # (it is not cached between runs), and idempotent, so it costs
            # nothing on the common path where generate-week.js's own per-date
            # pushes already landed everything. Catches the edge case where a
            # date's audio push succeeded but something after it in the same
            # retry attempt did not
            - name: Push Snippets to R2
              run: |
                  node scripts/sync-r2.js push-challenges
                  node scripts/sync-r2.js push-challenges --mode=challenger
              env:
                  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
                  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

            # Independent re-verification of the buffer from R2, not generate-week.js's
            # own report. This is what actually decides whether to alert, and it would
            # miss a problem that only shows up in the bucket, like a partial upload or
            # a catalog change that orphaned a songId, if it just trusted that script's
            # log. continue-on-error, since a healthcheck failure must never block a run
            # that already published a challenge.
            - name: Check challenge health
              id: challenge_health
              continue-on-error: true
              run: node scripts/challenge-health.js --json > challenge-health-report.json
              env:
                  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
                  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

            # Only when tomorrow itself is the problem
            # The generate step already gave every date its 3 attempts, but tomorrow
            # is the one date with no runway left, so it's worth spending one more
            # full 3-attempt pass on it specifically, rather than waiting for a cron
            # run that would land after tomorrow is already live
            # --target regenerates both modes for that date even if only one was
            # broken; that's safe and cheap
            # a day this far out is never "in play" yet, and generation is
            # deterministic, so redoing an already-healthy mode's day just
            # reproduces the same output
            - name: Retry urgent challenge gap
              if: steps.challenge_health.outcome == 'failure'
              continue-on-error: true
              run: |
                  TOMORROW=$(node -e "console.log(JSON.parse(require('fs').readFileSync('challenge-health-report.json','utf8')).tomorrow)")
                  node scripts/generate-week.js --target="$TOMORROW"
              env:
                  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
                  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

            # Re-verifies from R2 after the retry, same as the first check
            # Only runs when the first check failed, so this is skipped entirely on
            # the common healthy path
            # Its report overwrites challenge-health-report.json, which is what the
            # flag and issue-filing steps below actually read, so a same-run
            # self-heal is reflected everywhere downstream instead of only in this
            # step's own log
            - name: Re-check challenge health
              id: challenge_health_recheck
              if: steps.challenge_health.outcome == 'failure'
              continue-on-error: true
              run: node scripts/challenge-health.js --json > challenge-health-report.json
              env:
                  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
                  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

            # Tomorrow's challenge still missing or broken after the retry above
            # means the buffer is genuinely exhausted for at least one mode, not
            # just a blip the retry could absorb
            # Unlike a gap further out in the window, there is no runway left to
            # self-heal before a player hits it, so this gets an ::error annotation
            # rather than the ::warning the link sweep below uses: it is the one
            # failure mode that can actually break the game for a real player
            # tomorrow
            # Checks the RECHECK's outcome, not the first check's, since a step that
            # never ran (the common healthy path) reports 'skipped', which correctly
            # never matches 'failure'
            - name: Flag urgent challenge gap
              if: steps.challenge_health_recheck.outcome == 'failure'
              run: |
                  echo "::error title=Challenge buffer exhausted::Tomorrow's challenge is still missing or malformed for at least one mode after a retry, with no buffer days left to cover it. See the Check challenge health and Retry urgent challenge gap step logs."
                  {
                      echo "### Challenge buffer exhausted"
                      echo ""
                      echo "Tomorrow's challenge is still missing or malformed for at least one mode after an immediate retry. See the *Check challenge health* and *Retry urgent challenge gap* step logs, and the challenge-health issue, for details."
                  } >> "$GITHUB_STEP_SUMMARY"

            # Maintains ONE rolling "challenge-health" issue, same shape as
            # link-health below: update while any of the next 7 days is missing or
            # malformed for either mode, auto-close when the whole buffer is healthy
            # again. Wrapped so a filing failure degrades to a warning rather than
            # failing a run that already published a challenge.
            - name: File challenge-health issue
              continue-on-error: true
              uses: actions/github-script@v9
              with:
                  script: |
                      const fs = require('fs');
                      try {
                          const { today, tomorrow, modes } = JSON.parse(fs.readFileSync('challenge-health-report.json', 'utf8'));
                          const LABEL = 'challenge-health';
                          const TITLE = 'Challenge buffer needs attention';
                          const STATE_MARKER = /<!-- challenge-health-state: ([\s\S]*?) -->/;

                          const open = (await github.rest.issues.listForRepo({
                              ...context.repo, labels: LABEL, state: 'open',
                          })).data[0];

                          let previousState = {};
                          const stateMatch = open?.body?.match(STATE_MARKER);
                          if (stateMatch) {
                              try { previousState = JSON.parse(stateMatch[1]); } catch {}
                          }

                          const problems = Object.entries(modes).flatMap(([id, m]) =>
                              m.days.filter((d) => d.status !== 'ok').map((d) => ({ mode: id, ...d }))
                          );

                          // Actual error text for a problem this run also tried to fix, for
                          // extra detail alongside the health check's own shorter reason
                          let generationErrors = {};
                          try {
                              const generationResults = JSON.parse(fs.readFileSync('generation-report.json', 'utf8'));
                              for (const r of generationResults) {
                                  if (r.status === 'failed') generationErrors[`${r.mode}:${r.date}`] = r.error;
                              }
                          } catch {
                              // Missing on a manual dispatch that never ran generation
                              // Treat as none, not an error
                          }

                          function daysBetween(from, to) {
                              return Math.round((Date.parse(`${to}T00:00:00Z`) - Date.parse(`${from}T00:00:00Z`)) / 86400000);
                          }

                          // Whether a problem is the SAME one already open on an earlier run,
                          // not just repeated inside this run's own retries
                          // A sustained platform outage can produce identical errors across a
                          // few retries in 20 seconds and still clear before the next scheduled run
                          // Surviving a full day-to-day cycle of automatic retry is a much
                          // stronger sign that regenerating alone will not fix it
                          const nextState = {};
                          const persisting = [];

                          for (const p of problems) {
                              const key = `${p.mode}:${p.date}`;
                              const signature = `${p.status}:${(p.reason || '').slice(0, 200)}`;
                              const previous = previousState[key];
                              const firstSeen = previous?.signature === signature ? previous.firstSeen : today;
                              nextState[key] = { firstSeen, signature };

                              const days = daysBetween(firstSeen, today);
                              if (days >= 1) persisting.push({ ...p, days, error: generationErrors[key] });
                          }

                          for (const p of persisting) {
                              const detail = (p.error || p.reason || p.status).replace(/\n/g, ' ').slice(0, 200);
                              console.log(`::error title=Persisting challenge gap::${p.mode} ${p.date} has been broken for ${p.days}+ day(s): ${detail}`);
                          }

                          if (problems.length === 0) {
                              if (open) {
                                  await github.rest.issues.createComment({
                                      ...context.repo, issue_number: open.number,
                                      body: 'Challenge buffer fully healthy again, closing.',
                                  });
                                  await github.rest.issues.update({
                                      ...context.repo, issue_number: open.number, state: 'closed',
                                  });
                              }
                              return;
                          }

                          let body = 'Maintained automatically by `daily-challenges.yml` (rewritten each run).\n\n';

                          if (persisting.length) {
                              body += '### Persisting across multiple runs, likely needs a human\n\n';
                              body += 'Still broken after at least one full day of automatic retry, so regenerating alone has not fixed it and probably will not.\n\n';
                              body += '| Mode | Date | Days | Detail |\n|---|---|---|---|\n';
                              for (const p of persisting) {
                                  const urgent = p.date === tomorrow ? ' **(no buffer left)**' : '';
                                  const detail = (p.error || p.reason || p.status).replace(/\n/g, ' ').slice(0, 200).replace(/\|/g, '\\|');
                                  body += `| ${p.mode} | ${p.date}${urgent} | ${p.days}+ | \`${detail}\` |\n`;
                              }
                              body += '\n';
                          }

                          const fresh = problems.filter((p) => !persisting.some((x) => x.mode === p.mode && x.date === p.date));
                          if (fresh.length) {
                              body += '### Buffer gaps\n\n';
                              body += '| Mode | Date | Status | Detail |\n|---|---|---|---|\n';
                              for (const p of fresh) {
                                  const urgent = p.date === tomorrow ? ' **(no buffer left)**' : '';
                                  body += `| ${p.mode} | ${p.date}${urgent} | ${p.status} | ${p.reason || ''} |\n`;
                              }
                              body += '\nEach date is retried automatically on tomorrow\'s scheduled run.\n\n';
                          }

                          body += 'To fix by hand: `node scripts/generate-week.js --target=<date>`, then verify with `node scripts/challenge-health.js`.\n\n';
                          body += `<!-- challenge-health-state: ${JSON.stringify(nextState).replace(/-->/g, '..')} -->`;

                          try {
                              await github.rest.issues.getLabel({ ...context.repo, name: LABEL });
                          } catch {
                              await github.rest.issues.createLabel({ ...context.repo, name: LABEL, color: 'd73a4a' });
                          }

                          if (open) {
                              await github.rest.issues.update({ ...context.repo, issue_number: open.number, title: TITLE, body });
                          } else {
                              await github.rest.issues.create({ ...context.repo, title: TITLE, body, labels: [LABEL] });
                          }
                      } catch (e) {
                          core.warning(`challenge-health issue update failed (challenges were still checked): ${e.message}`);
                          await core.summary
                              .addRaw(`### challenge-health issue update failed\n\nThe health check still ran; only the notification failed.\n\n\`${e.message}\`\n`)
                              .write();
                      }

            # Full liveness pass over EVERY streaming link, folded in from the old
            # standalone verify-links cron. HEAD-check each link, heal a dead one
            # (MusicLink; the YouTube Data API for `youtube`; co-derive `youtubeMusic`
            # from the healed `youtube` id), hide what can't be healed. Does NO
            # scraping, so it is safe unattended. Tomorrow's challenge tracks are a
            # subset of the catalog, so they are verified ~26h before players reach
            # them -- this replaces the old scoped pre-publish pass. continue-on-error
            # so a link hiccup never blocks the challenge; fresh pull-data first;
            # push-data-json publishes link changes without touching album art.
            - name: Verify, heal & hide links
              id: verify_links
              continue-on-error: true
              run: |
                  node scripts/sync-r2.js pull-data
                  pnpm links --verify
                  node scripts/sync-r2.js push-data-json
              env:
                  MUSICLINK_API_KEY: ${{ secrets.MUSICLINK_API_KEY }}
                  YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
                  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
                  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

            # Same sweep for challenger, but under the strict link policy: dead
            # links heal from MusicLink (ISRC) only, never from a search, and
            # anything that cannot be healed authoritatively is hidden rather than
            # replaced with a guess. Only 3 challenger tracks carry an ISRC, so
            # this costs at most 3 MusicLink calls against the 300/mo cap.
            - name: Verify, heal & hide links (challenger)
              id: verify_links_challenger
              continue-on-error: true
              run: |
                  node scripts/sync-r2.js pull-data --mode=challenger
                  node scripts/resolve-links.js --mode=challenger --verify
                  node scripts/sync-r2.js push-data-json --mode=challenger
              env:
                  MUSICLINK_API_KEY: ${{ secrets.MUSICLINK_API_KEY }}
                  YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
                  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
                  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

            # verify_links is continue-on-error so a failure never blocks the publish;
            # surface it anyway (`outcome` is the pre-continue result) as a warning
            # annotation + run summary, so a silently-skipped sweep is visible instead
            # of hiding behind a green run. The next daily run re-verifies everything,
            # so a single miss is never fatal.
            - name: Flag failed link verification
              if: steps.verify_links.outcome == 'failure' || steps.verify_links_challenger.outcome == 'failure'
              run: |
                  FAILED=""
                  [ "${{ steps.verify_links.outcome }}" = "failure" ] && FAILED="normal"
                  [ "${{ steps.verify_links_challenger.outcome }}" = "failure" ] && FAILED="${FAILED:+$FAILED, }challenger"

                  echo "::warning title=Link verification failed::The link sweep errored this run for: $FAILED. Those streaming links were not verified/healed. The challenge audio still published; the next daily run re-verifies."
                  {
                      echo "### ⚠️ Link verification failed ($FAILED)"
                      echo ""
                      echo "The link sweep errored this run, so streaming links were not verified or healed for: $FAILED. The challenge audio published normally, and the next daily run is the backstop. See the *Verify, heal & hide links* step logs for the exception."
                  } >> "$GITHUB_STEP_SUMMARY"

            # Machine-readable snapshot of what still needs a human, from the registry
            # this run just wrote (persistent deadLinks, not the per-run
            # link-issues.json). verify_links is continue-on-error, so this and the
            # issue step still run after a link hiccup.
            # continue-on-error: notification is not the job's critical path, so a
            # failure here must never red the run that just published the challenge.
            - name: Build link-health report
              continue-on-error: true
              run: node scripts/link-issues.js --json --modes=normal,challenger > link-issues-report.json

            # Maintain ONE rolling "link-health" issue: update it while anything is
            # hidden/missing, auto-close it when everything is healthy again. No
            # per-link spam, and no extra secret -- the default GITHUB_TOKEN suffices.
            # The whole body is wrapped so a filing failure (issues disabled, API
            # hiccup, missing report) degrades to a warning + run summary instead of
            # failing the job; continue-on-error is the belt to that suspenders.
            - name: File link-health issue
              continue-on-error: true
              uses: actions/github-script@v9
              with:
                  script: |
                      const fs = require('fs');
                      try {
                          const { modes } = JSON.parse(fs.readFileSync('link-issues-report.json', 'utf8'));
                          const LABEL = 'link-health';
                          const TITLE = 'Streaming links needing attention';

                          const open = (await github.rest.issues.listForRepo({
                              ...context.repo, labels: LABEL, state: 'open',
                          })).data[0];

                          // Nothing dead, nothing unexpectedly empty and nothing
                          // awaiting triage, in ANY mode. Note `empty` already
                          // excludes tracks marked linksOptional -- under the strict
                          // policy a leak that was swept and found nowhere is the
                          // expected state, not a problem to reopen this every night.
                          const actionable = Object.values(modes).some(
                              (m) => m.dead.length || m.empty.length || m.review.length
                          );

                          if (!actionable) {
                              if (open) {
                                  await github.rest.issues.createComment({
                                      ...context.repo, issue_number: open.number,
                                      body: 'All streaming links healthy again — closing.',
                                  });
                                  await github.rest.issues.update({
                                      ...context.repo, issue_number: open.number, state: 'closed',
                                  });
                              }
                              return;
                          }

                          let body = 'Maintained automatically by `daily-challenges.yml` (rewritten each run).\n\n';

                          for (const [id, m] of Object.entries(modes)) {
                              if (!m.dead.length && !m.empty.length && !m.review.length) continue;
                              body += `## ${id}\n\n`;

                              if (m.dead.length) {
                                  body += `### Dead links hidden from players (${m.dead.length})\n\n`;
                                  body += '| Song | Platform | URL | Dead since |\n|---|---|---|---|\n';
                                  for (const d of m.dead) body += `| ${d.title} | ${d.platform} | ${d.url} | ${d.since} |\n`;
                                  body += '\n';
                              }
                              if (m.empty.length) {
                                  body += `### Songs with no links at all (${m.empty.length})\n\n`;
                                  for (const e of m.empty) body += `- ${e.title} (\`${e.id}\`)\n`;
                                  body += '\n';
                              }
                              if (m.optionalEmpty?.length) {
                                  body += `_${m.optionalEmpty.length} further track(s) were swept and found nowhere online — expected for this catalog, not reported._\n\n`;
                              }
                              if (m.review.length) {
                                  body += `### Candidates awaiting review (${m.review.length})\n\n`;
                                  body += '| Song | Platform | Candidate | Uploader | URL |\n|---|---|---|---|---|\n';
                                  for (const c of m.review) body += `| ${c.title} | ${c.platform} | ${c.candidate} | ${c.uploader || '?'} | ${c.url} |\n`;
                                  body += `\nAccept or reject with \`pnpm links:review --mode=${id} --list\`.\n\n`;
                              }
                          }

                          body += 'Recover with a local `pnpm links` (full scrapers), or hand-add the URL to the song in the registry, then `pnpm scan` + push-data.';

                          try {
                              await github.rest.issues.getLabel({ ...context.repo, name: LABEL });
                          } catch {
                              await github.rest.issues.createLabel({ ...context.repo, name: LABEL, color: 'd73a4a' });
                          }

                          if (open) {
                              await github.rest.issues.update({ ...context.repo, issue_number: open.number, title: TITLE, body });
                          } else {
                              await github.rest.issues.create({ ...context.repo, title: TITLE, body, labels: [LABEL] });
                          }
                      } catch (e) {
                          core.warning(`link-health issue update failed (links were still verified/hidden): ${e.message}`);
                          await core.summary
                              .addRaw(`### ⚠️ link-health issue update failed\n\nLinks were still verified and dead ones hidden; only the notification failed.\n\n\`${e.message}\`\n`)
                              .write();
                      }
