name: Daily Challenges

on:
    schedule:
        # 05:09 UTC daily. Deliberately off the top of the hour: GitHub can delay
        # or drop scheduled runs during the high-load spike at :00.
        #
        # This is only WHEN generation runs. Challenges unlock for players at
        # 00:00 Pacific (the site rolls over at PT midnight -- see getTodayDate;
        # that is 07:00-08:00 UTC depending on DST). The run on day D produces the
        # D+1 date string, so the challenge lands in R2 ~26 hours before it is
        # needed -- ample slack even if a run is delayed.
        - cron: '9 5 * * *'
    workflow_dispatch:
        inputs:
            target_date:
                description: 'Specific date to generate (YYYY-MM-DD)'
                required: false
                default: ''
            start_date:
                description: 'Start date for range (YYYY-MM-DD)'
                required: false
                default: ''
            end_date:
                description: 'End date for range (YYYY-MM-DD)'
                required: false
                default: ''

jobs:
    generate:
        if: github.repository == 'mewdini/removedle' && (github.event_name == 'schedule' || github.actor == 'mewdini')
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install

            - name: Restore cache
              id: cache-restore
              uses: actions/cache@v6
              with:
                  path: |
                      out/data
                      out/masters
                      out/covers
                  key: removedle-cache-${{ github.run_id }}
                  restore-keys: removedle-cache-

            - name: Pull Masters & Data from R2
              if: steps.cache-restore.outputs.cache-matched-key == ''
              run: |
                  node scripts/sync-r2.js pull-masters
                  node scripts/sync-r2.js pull-data
              env:
                  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
                  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

            - name: Generate Snippets
              run: |
                  START_DATE="${{ github.event.inputs.start_date }}"
                  END_DATE="${{ github.event.inputs.end_date }}"
                  TARGET_DATE="${{ github.event.inputs.target_date }}"

                  # Record each date generated so the link-verify step below knows
                  # exactly which challenges to check.
                  : > generated-dates.txt

                  if [ -n "$START_DATE" ] && [ -n "$END_DATE" ]; then
                      echo "Generating range: $START_DATE to $END_DATE"
                      CURRENT="$START_DATE"
                      while [[ "$CURRENT" < "$END_DATE" || "$CURRENT" == "$END_DATE" ]]; do
                          echo "Processing $CURRENT..."
                          node scripts/generate-daily.js "$CURRENT"
                          echo "$CURRENT" >> generated-dates.txt
                          CURRENT=$(date -I -d "$CURRENT + 1 day")
                      done
                  else
                      if [ -z "$TARGET_DATE" ]; then
                          TARGET_DATE=$(date -d "tomorrow" +%Y-%m-%d)
                      fi
                      echo "Generating for date: $TARGET_DATE"
                      node scripts/generate-daily.js "$TARGET_DATE"
                      echo "$TARGET_DATE" >> generated-dates.txt
                  fi
              env:
                  MASTERS_DIR: ./out/masters
                  DATA_DIR: ./out/data
                  OUTPUT_DIR: ./out/dailies
                  # Needed since the challenges bucket went private: the generator
                  # reads the previous days' meta.json over the S3 API to avoid
                  # repeating songs. Without these it throws instead of silently
                  # producing a challenge with no de-duplication.
                  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
                  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

            # Before the challenge goes live, verify the streaming links of the
            # tracks it features, so players don't hit a dead link on the results
            # screen: HEAD-check each, heal via MusicLink, hide what can't be healed.
            # continue-on-error so a link hiccup never blocks publishing the audio.
            # Fresh pull-data first (the cached out/data may be stale) makes the
            # scoped registry write safe against the weekly verify-links cron;
            # push-data-json publishes the changes without touching album art.
            - name: Verify challenge links (pre-publish)
              id: verify_links
              continue-on-error: true
              run: |
                  node scripts/sync-r2.js pull-data
                  while read -r DATE; do
                      [ -n "$DATE" ] || continue
                      echo "Verifying links for challenge $DATE..."
                      node scripts/resolve-links.js --verify --challenge="$DATE"
                  done < generated-dates.txt
                  node scripts/sync-r2.js push-data-json
              env:
                  OUTPUT_DIR: ./out/dailies
                  DATA_DIR: ./out/data
                  MUSICLINK_API_KEY: ${{ secrets.MUSICLINK_API_KEY }}
                  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
                  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

            # The step above is continue-on-error so a failure never blocks the
            # publish; surface it anyway (`outcome` is the pre-continue result) as
            # a warning annotation + run summary, so a silently-skipped verification
            # is still visible instead of hiding behind a green run.
            - name: Flag failed link verification
              if: steps.verify_links.outcome == 'failure'
              run: |
                  DATES="$(tr '\n' ' ' < generated-dates.txt)"
                  echo "::warning title=Challenge link verification failed::Links for [$DATES] were NOT verified/healed this run (the step errored). The challenge still publishes; the weekly verify-links sweep will catch dead links."
                  {
                      echo "### ⚠️ Challenge link verification failed"
                      echo ""
                      echo "The pre-publish link check errored, so links for **$DATES** were not verified or healed this run. The challenge audio published normally; the weekly \`verify-links\` sweep remains a backstop. See the *Verify challenge links* step log for the exception."
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Push Snippets to R2
              run: node scripts/sync-r2.js push-challenges
              env:
                  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
                  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
