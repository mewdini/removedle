name: Daily Challenges

on:
    schedule:
        # 05:09 UTC daily. Deliberately off the top of the hour: GitHub can delay
        # or drop scheduled runs during the high-load spike at :00.
        #
        # This is only WHEN generation runs. Challenges unlock for players at
        # 00:00 Pacific (the site rolls over at PT midnight -- see getTodayDate;
        # that is 07:00-08:00 UTC depending on DST). The run on day D produces the
        # D+1 date string, so the challenge lands in R2 ~26 hours before it is
        # needed -- ample slack even if a run is delayed.
        #
        # The same run also does a full streaming-link liveness sweep, folded in
        # from the old standalone verify-links cron: one schedule we know fires
        # beats two independently-scheduled ones, given how much GitHub delays and
        # drops scheduled runs.
        - cron: '9 5 * * *'
    workflow_dispatch:
        inputs:
            target_date:
                description: 'Specific date to generate (YYYY-MM-DD)'
                required: false
                default: ''
            start_date:
                description: 'Start date for range (YYYY-MM-DD)'
                required: false
                default: ''
            end_date:
                description: 'End date for range (YYYY-MM-DD)'
                required: false
                default: ''

jobs:
    generate:
        if: github.repository == 'mewdini/removedle' && (github.event_name == 'schedule' || github.actor == 'mewdini')
        runs-on: ubuntu-latest
        # issues: write for the rolling link-health issue below; contents: read for
        # checkout. No contents: write -- this job never commits to the repo.
        permissions:
            contents: read
            issues: write
        steps:
            - uses: actions/checkout@v7

            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install

            - name: Restore cache
              id: cache-restore
              uses: actions/cache@v6
              with:
                  path: |
                      out/data
                      out/masters
                      out/covers
                      out/challenger/data
                      out/challenger/masters
                      out/challenger/covers
                  key: removedle-cache-${{ github.run_id }}
                  restore-keys: removedle-cache-

            # Every mode shares the same buckets, separated by key prefix, so each
            # pull excludes the other modes' prefixes (see scripts/sync-r2.js).
            # Without that, normal's pull would drag challenger/* into out/data and
            # normal's next push -- which overwrites wholesale -- would re-upload a
            # stale copy, silently reverting challenger's link heals and hides.
            # Deliberately NOT gated on a cache miss. restore-keys matches any
            # older cache by prefix, including ones saved before a mode existed --
            # those restore only the paths they held, so the new mode's registry
            # would be missing while the cache still counted as "hit" and skipped
            # this step, and generate would die with "No registry found". Pulling
            # every run is cheap anyway: syncPull skips any object whose size
            # already matches locally, so a warm cache downloads almost nothing.
            - name: Pull Masters & Data from R2
              run: |
                  node scripts/sync-r2.js pull-masters
                  node scripts/sync-r2.js pull-data
                  node scripts/sync-r2.js pull-masters --mode=challenger
                  node scripts/sync-r2.js pull-data --mode=challenger
              env:
                  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
                  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

            - name: Generate Snippets
              run: |
                  START_DATE="${{ github.event.inputs.start_date }}"
                  END_DATE="${{ github.event.inputs.end_date }}"
                  TARGET_DATE="${{ github.event.inputs.target_date }}"

                  # A plain record of the dates this run generated (handy in the run
                  # log for a range backfill); the link sweep below verifies the whole
                  # catalog, so nothing consumes this file anymore.
                  : > generated-dates.txt

                  # Every mode gets its own challenge for the same date.
                  generate_all() {
                      node scripts/generate-daily.js "$1"
                      node scripts/generate-daily.js --mode=challenger "$1"
                  }

                  if [ -n "$START_DATE" ] && [ -n "$END_DATE" ]; then
                      echo "Generating range: $START_DATE to $END_DATE"
                      CURRENT="$START_DATE"
                      while [[ "$CURRENT" < "$END_DATE" || "$CURRENT" == "$END_DATE" ]]; do
                          echo "Processing $CURRENT..."
                          generate_all "$CURRENT"
                          echo "$CURRENT" >> generated-dates.txt
                          CURRENT=$(date -I -d "$CURRENT + 1 day")
                      done
                  else
                      if [ -z "$TARGET_DATE" ]; then
                          TARGET_DATE=$(date -d "tomorrow" +%Y-%m-%d)
                      fi
                      echo "Generating for date: $TARGET_DATE"
                      generate_all "$TARGET_DATE"
                      echo "$TARGET_DATE" >> generated-dates.txt
                  fi
              env:
                  # No MASTERS_DIR/DATA_DIR/OUTPUT_DIR here: they already equal the
                  # script defaults, and a dir override that does not name the mode
                  # is refused outright (scripts/lib/modes.js) -- that guard is what
                  # stops a stray DATA_DIR making a challenger run rewrite normal's
                  # registry and destroy its permanent song IDs.
                  #
                  # Needed since the challenges bucket went private: the generator
                  # reads the previous days' meta.json over the S3 API to avoid
                  # repeating songs. Without these it throws instead of silently
                  # producing a challenge with no de-duplication.
                  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
                  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

            # Publish the audio first, so tomorrow's challenge is live no matter what
            # the link pass does next. Audio (challenges bucket) and links (data
            # bucket) are independent, so nothing about the challenge depends on the
            # verify below -- putting it first means a slow or failing link sweep can
            # never delay or block the audio.
            - name: Push Snippets to R2
              run: |
                  node scripts/sync-r2.js push-challenges
                  node scripts/sync-r2.js push-challenges --mode=challenger
              env:
                  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
                  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

            # Full liveness pass over EVERY streaming link, folded in from the old
            # standalone verify-links cron. HEAD-check each link, heal a dead one
            # (MusicLink; the YouTube Data API for `youtube`; co-derive `youtubeMusic`
            # from the healed `youtube` id), hide what can't be healed. Does NO
            # scraping, so it is safe unattended. Tomorrow's challenge tracks are a
            # subset of the catalog, so they are verified ~26h before players reach
            # them -- this replaces the old scoped pre-publish pass. continue-on-error
            # so a link hiccup never blocks the challenge; fresh pull-data first;
            # push-data-json publishes link changes without touching album art.
            - name: Verify, heal & hide links
              id: verify_links
              continue-on-error: true
              run: |
                  node scripts/sync-r2.js pull-data
                  pnpm links --verify
                  node scripts/sync-r2.js push-data-json
              env:
                  MUSICLINK_API_KEY: ${{ secrets.MUSICLINK_API_KEY }}
                  YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
                  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
                  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

            # Same sweep for challenger, but under the strict link policy: dead
            # links heal from MusicLink (ISRC) only, never from a search, and
            # anything that cannot be healed authoritatively is hidden rather than
            # replaced with a guess. Only 3 challenger tracks carry an ISRC, so
            # this costs at most 3 MusicLink calls against the 300/mo cap.
            - name: Verify, heal & hide links (challenger)
              id: verify_links_challenger
              continue-on-error: true
              run: |
                  node scripts/sync-r2.js pull-data --mode=challenger
                  node scripts/resolve-links.js --mode=challenger --verify
                  node scripts/sync-r2.js push-data-json --mode=challenger
              env:
                  MUSICLINK_API_KEY: ${{ secrets.MUSICLINK_API_KEY }}
                  YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
                  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
                  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

            # verify_links is continue-on-error so a failure never blocks the publish;
            # surface it anyway (`outcome` is the pre-continue result) as a warning
            # annotation + run summary, so a silently-skipped sweep is visible instead
            # of hiding behind a green run. The next daily run re-verifies everything,
            # so a single miss is never fatal.
            - name: Flag failed link verification
              if: steps.verify_links.outcome == 'failure' || steps.verify_links_challenger.outcome == 'failure'
              run: |
                  FAILED=""
                  [ "${{ steps.verify_links.outcome }}" = "failure" ] && FAILED="normal"
                  [ "${{ steps.verify_links_challenger.outcome }}" = "failure" ] && FAILED="${FAILED:+$FAILED, }challenger"

                  echo "::warning title=Link verification failed::The link sweep errored this run for: $FAILED. Those streaming links were not verified/healed. The challenge audio still published; the next daily run re-verifies."
                  {
                      echo "### ⚠️ Link verification failed ($FAILED)"
                      echo ""
                      echo "The link sweep errored this run, so streaming links were not verified or healed for: $FAILED. The challenge audio published normally, and the next daily run is the backstop. See the *Verify, heal & hide links* step logs for the exception."
                  } >> "$GITHUB_STEP_SUMMARY"

            # Machine-readable snapshot of what still needs a human, from the registry
            # this run just wrote (persistent deadLinks, not the per-run
            # link-issues.json). verify_links is continue-on-error, so this and the
            # issue step still run after a link hiccup.
            # continue-on-error: notification is not the job's critical path, so a
            # failure here must never red the run that just published the challenge.
            - name: Build link-health report
              continue-on-error: true
              run: node scripts/link-issues.js --json --modes=normal,challenger > link-issues-report.json

            # Maintain ONE rolling "link-health" issue: update it while anything is
            # hidden/missing, auto-close it when everything is healthy again. No
            # per-link spam, and no extra secret -- the default GITHUB_TOKEN suffices.
            # The whole body is wrapped so a filing failure (issues disabled, API
            # hiccup, missing report) degrades to a warning + run summary instead of
            # failing the job; continue-on-error is the belt to that suspenders.
            - name: File link-health issue
              continue-on-error: true
              uses: actions/github-script@v9
              with:
                  script: |
                      const fs = require('fs');
                      try {
                          const { modes } = JSON.parse(fs.readFileSync('link-issues-report.json', 'utf8'));
                          const LABEL = 'link-health';
                          const TITLE = 'Streaming links needing attention';

                          const open = (await github.rest.issues.listForRepo({
                              ...context.repo, labels: LABEL, state: 'open',
                          })).data[0];

                          // Nothing dead, nothing unexpectedly empty and nothing
                          // awaiting triage, in ANY mode. Note `empty` already
                          // excludes tracks marked linksOptional -- under the strict
                          // policy a leak that was swept and found nowhere is the
                          // expected state, not a problem to reopen this every night.
                          const actionable = Object.values(modes).some(
                              (m) => m.dead.length || m.empty.length || m.review.length
                          );

                          if (!actionable) {
                              if (open) {
                                  await github.rest.issues.createComment({
                                      ...context.repo, issue_number: open.number,
                                      body: 'All streaming links healthy again — closing.',
                                  });
                                  await github.rest.issues.update({
                                      ...context.repo, issue_number: open.number, state: 'closed',
                                  });
                              }
                              return;
                          }

                          let body = 'Maintained automatically by `daily-challenges.yml` (rewritten each run).\n\n';

                          for (const [id, m] of Object.entries(modes)) {
                              if (!m.dead.length && !m.empty.length && !m.review.length) continue;
                              body += `## ${id}\n\n`;

                              if (m.dead.length) {
                                  body += `### Dead links hidden from players (${m.dead.length})\n\n`;
                                  body += '| Song | Platform | URL | Dead since |\n|---|---|---|---|\n';
                                  for (const d of m.dead) body += `| ${d.title} | ${d.platform} | ${d.url} | ${d.since} |\n`;
                                  body += '\n';
                              }
                              if (m.empty.length) {
                                  body += `### Songs with no links at all (${m.empty.length})\n\n`;
                                  for (const e of m.empty) body += `- ${e.title} (\`${e.id}\`)\n`;
                                  body += '\n';
                              }
                              if (m.optionalEmpty?.length) {
                                  body += `_${m.optionalEmpty.length} further track(s) were swept and found nowhere online — expected for this catalog, not reported._\n\n`;
                              }
                              if (m.review.length) {
                                  body += `### Candidates awaiting review (${m.review.length})\n\n`;
                                  body += '| Song | Platform | Candidate | Uploader | URL |\n|---|---|---|---|---|\n';
                                  for (const c of m.review) body += `| ${c.title} | ${c.platform} | ${c.candidate} | ${c.uploader || '?'} | ${c.url} |\n`;
                                  body += `\nAccept or reject with \`pnpm links:review --mode=${id} --list\`.\n\n`;
                              }
                          }

                          body += 'Recover with a local `pnpm links` (full scrapers), or hand-add the URL to the song in the registry, then `pnpm scan` + push-data.';

                          try {
                              await github.rest.issues.getLabel({ ...context.repo, name: LABEL });
                          } catch {
                              await github.rest.issues.createLabel({ ...context.repo, name: LABEL, color: 'd73a4a' });
                          }

                          if (open) {
                              await github.rest.issues.update({ ...context.repo, issue_number: open.number, title: TITLE, body });
                          } else {
                              await github.rest.issues.create({ ...context.repo, title: TITLE, body, labels: [LABEL] });
                          }
                      } catch (e) {
                          core.warning(`link-health issue update failed (links were still verified/hidden): ${e.message}`);
                          await core.summary
                              .addRaw(`### ⚠️ link-health issue update failed\n\nLinks were still verified and dead ones hidden; only the notification failed.\n\n\`${e.message}\`\n`)
                              .write();
                      }
