name: Sync Metadata

on:
    workflow_dispatch:
        inputs:
            mode:
                description: 'Which game mode to re-scan'
                required: false
                default: 'both'
                type: choice
                options:
                    - both
                    - normal
                    - challenger

jobs:
    sync:
        if: github.repository == 'mewdini/removedle' && github.actor == 'mewdini'
        runs-on: ubuntu-latest
        env:
            MODE_INPUT: ${{ github.event.inputs.mode || 'both' }}
        steps:
            - uses: actions/checkout@v7

            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install

            - name: Set up cache
              uses: actions/cache@v6
              with:
                  path: |
                      out/data
                      out/masters
                      out/covers
                      out/challenger/data
                      out/challenger/masters
                      out/challenger/covers
                  key: removedle-cache-${{ github.run_id }}
                  restore-keys: removedle-cache-

            # Modes share the buckets and are separated by key prefix, so each pull
            # excludes the other modes' prefixes (see scripts/sync-r2.js).
            - name: Pull from R2 (normal)
              if: env.MODE_INPUT == 'both' || env.MODE_INPUT == 'normal'
              run: |
                  node scripts/sync-r2.js pull-masters
                  node scripts/sync-r2.js pull-data
                  node scripts/sync-r2.js pull-art
              env:
                  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
                  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

            # No MASTERS_DIR/DATA_DIR/COVERS_DIR overrides: they already equal the
            # script defaults, and an override that does not name the mode is
            # refused outright (scripts/lib/modes.js) so a stray one can never make
            # one mode's scan rewrite another mode's registry.
            - name: Scan Songs & Extract Art (normal)
              if: env.MODE_INPUT == 'both' || env.MODE_INPUT == 'normal'
              run: node scripts/scan-songs.js

            - name: Push Metadata & Art to R2 (normal)
              if: env.MODE_INPUT == 'both' || env.MODE_INPUT == 'normal'
              run: node scripts/sync-r2.js push-data
              env:
                  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
                  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

            - name: Pull from R2 (challenger)
              if: env.MODE_INPUT == 'both' || env.MODE_INPUT == 'challenger'
              run: |
                  node scripts/sync-r2.js pull-masters --mode=challenger
                  node scripts/sync-r2.js pull-data --mode=challenger
                  node scripts/sync-r2.js pull-art --mode=challenger
              env:
                  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
                  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

            - name: Scan Songs & Extract Art (challenger)
              if: env.MODE_INPUT == 'both' || env.MODE_INPUT == 'challenger'
              run: node scripts/scan-songs.js --mode=challenger

            - name: Push Metadata & Art to R2 (challenger)
              if: env.MODE_INPUT == 'both' || env.MODE_INPUT == 'challenger'
              run: node scripts/sync-r2.js push-data --mode=challenger
              env:
                  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
                  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
